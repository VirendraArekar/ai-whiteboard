name: AI Whiteboard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_whiteboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm --workspace=server run prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_whiteboard

      - name: Run Backend Unit Tests
        run: npm --workspace=server run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_whiteboard
          JWT_ACCESS_SECRET: test_secret_key_minimum_32_characters_long!
          JWT_REFRESH_SECRET: test_refresh_secret_key_minimum_32_characters_long!

      - name: Build Backend
        run: npm --workspace=server run build

      - name: Run Frontend Unit Tests
        run: npm --workspace=client run test

      - name: Build Frontend
        run: npm --workspace=client run build

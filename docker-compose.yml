services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_whiteboard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_whiteboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_whiteboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: coollabsio/minio:latest
    container_name: ai_whiteboard_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "/bin/mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: coollabsio/minio:latest
    container_name: ai_whiteboard_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /bin/mc mb --ignore-existing myminio/ai-whiteboard;
      /bin/mc anonymous set download myminio/ai-whiteboard;
      echo 'MinIO bucket ai-whiteboard created and configured';
      exit 0;
      "

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ai_whiteboard_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_whiteboard
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-default_jwt_access_secret_key_minimum_32_chars!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-default_jwt_refresh_secret_key_minimum_32_chars!}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: ai-whiteboard
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "${SERVER_PORT:-3000}:3000"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
    container_name: ai_whiteboard_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-5173}:80"

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local
